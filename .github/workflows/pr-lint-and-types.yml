name: PR - Lint and Types

on:
  pull_request:
    branches:
      - develop
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "openapi/**"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: pr-lint-and-types-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests --select E,F,ERA --line-length 120 --exclude src/interface/rest/generated

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Type check (mypy)
        run: mypy --config-file pyproject.toml --explicit-package-bases

      - name: Validate OpenAPI
        run: openapi-spec-validator openapi/openapi.yml
