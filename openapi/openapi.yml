  /api/v1/teams/{team_id}/stats/{season}:
    get:
      tags:
        - Teams
        - Stats
      summary: Get Team Stats
      description: >
        Returns season-level composite statistics for a team, grouped by
        hitting, pitching, fielding and catching. Use the optional `category`
        query parameter to limit the response to a single block while the
        remaining categories are returned as `null` for compatibility.
      operationId: get_team_season_composite_stats
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: integer
            title: Team Id
            description: The ID of the team to get stats for
          description: The ID of the team to get stats for
        - name: season
          in: path
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - hitting
              - pitching
              - fielding
              - catching
              - all
            default: all
          description: "Optional stats category filter. Defaults to `all`."
      responses:
        '200':
          description: Successfully retrieved team composite statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSeasonStatsDetailResponse'
