  /api/v1/cache/stats:
    get:
      tags:
        - System
      summary: Get Cache Stats
      description: "Get cache statistics for monitoring and debugging purposes.\n\n\
        Returns detailed information about the cache system including hit rates,\n\
        memory usage, and key statistics.\n\nArgs:\n    use_cases: Dependency injected\
        \ dictionary containing use cases\n\nReturns:\n    JSONResponse: Standardized\
        \ response with cache statistics"
      operationId: get_cache_stats_api_v1_cache_stats_get
      parameters:
        - name: include_keys
          in: query
          required: false
          schema:
            type: boolean
            default: false
            description: Include a sample of keys in stats output
          description: Include a sample of keys in stats output
        - name: pattern
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pattern to match keys when include_keys=true (e.g., 'mlb:*')
            title: Pattern
          description: Pattern to match keys when include_keys=true (e.g., 'mlb:*')
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
            description: Max number of keys to list when include_keys=true
            title: Limit
          description: Max number of keys to list when include_keys=true
      responses:
        '200':
          description: Successfully retrieved cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
              example:
                status: success
                code: 200
                data:
                  cache_stats:
                    connected_clients: 5
                    used_memory: 1048576
                    used_memory_human: "1.00M"
                    total_connections_received: 12345
                    total_commands_processed: 67890
                    keyspace_hits: 1000
                    keyspace_misses: 200
                    hit_rate_percentage: 83.33
                    total_requests: 1200
                    total_keys: 42
                    keys_pattern: "mlb:*"
                    keys_returned: 3
                    keys:
                      - "mlb:teams:2025"
