        \ will\nbe returned.\n\nArgs:\n    league: Optional filter by league (e.g.,\
        \ American or National)\n    division: Optional filter by division (e.g.,\
        \ East, West, Central)\n    use_cases: Dependency injected dictionary containing\
        \ use cases\n\nReturns:\n    JSONResponse: Standardized response with list\
        \ of teams\n\nRaises:\n    DomainExceptions.InvalidDataError: If invalid filter\
        \ parameters are provided"
      operationId: list_teams_api_v1_teams_get
      parameters:
        - name: league
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by league (e.g. American or National)
            title: League
          description: Filter by league (e.g. American or National)
        - name: division
          in: query
          required: false
