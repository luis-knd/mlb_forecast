                    code: 200
                    data:
                      team_id: 62
                      season: 2025
                      hitting:
                        hits: 1450
                        games_played: 162
                      pitching:
                        wins: 90
                        games_played: 162
                      fielding:
                        total_chances: 5100
                        games_played: 162
                      catching:
                        caught_stealing: 45
                        games_played: 162
                      updated_at: '2025-07-25T17:58:28Z'
                    errors: []
                    message: Team statistics retrieved successfully
                hitting:
                  summary: Hitting category only
                  value:
                    status: success
                    code: 200
                    data:
                      team_id: 62
                      season: 2025
                      hitting:
                        hits: 1450
                        games_played: 162
                      pitching: null
                      fielding: null
                      catching: null
                      updated_at: '2025-07-25T17:58:28Z'
                    errors: []
                    message: Team hitting statistics retrieved successfully
                pitching:
                  summary: Pitching category only
                  value:
                    status: success
                    code: 200
                    data:
                      team_id: 62
                      season: 2025
                      hitting: null
                      pitching:
                        wins: 90
                        innings_pitched: 1450.1
                      fielding: null
                      catching: null
                      updated_at: '2025-07-25T17:58:28Z'
                    errors: []
                    message: Team pitching statistics retrieved successfully
                fielding:
                  summary: Fielding category only
                  value:
                    status: success
                    code: 200
                    data:
                      team_id: 62
                      season: 2025
                      hitting: null
                      pitching: null
                      fielding:
                        total_chances: 5100
                        fielding_percentage: 0.972
                      catching: null
