exclude: ^src/interface/rest/generated/.*$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [ "--allow-missing-credentials" ]
      - id: pretty-format-json
      - id: name-tests-test

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args:
          - "--select=E,W,F,ERA,UP,BLE,B,C4,SIM"
          - "--fix"
          - "--line-length=120"
          - "--extend-ignore=E203,B008,B904,BLE001,SIM102,SIM103,SIM105,UP038"
          - "--exclude=src/interface/rest/generated"
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint-no-self-use
        name: pylint (method may be static)
        language: python
        entry: pylint
        types: [python]
        files: ^src/infrastructure/db/repositories/.*\.py$
        additional_dependencies:
          - pylint>=3.3.0
        args:
          - "--disable=all"
          - "--enable=R6301"
          - "--load-plugins=pylint.extensions.no_self_use"

  - repo: https://github.com/python-openapi/openapi-spec-validator
    rev: 0.8.0b1
    hooks:
      - id: openapi-spec-validator

  # Secrets scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        pass_filenames: false
        exclude: |
          (?x)^(
            src/interface/rest/generated/.*$
          )
