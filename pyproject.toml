[project]
name = "mlb-forecast-backend"
version = "1.0.0"
description = "MLB Forecast Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Luis Candelario", email = "lcandelario@lcandesign.com"},
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests/"]
also_copy = ["pyproject.toml", "openapi/", "scripts/quality/"]
