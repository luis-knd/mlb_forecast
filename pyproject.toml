[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-forecast-backend"
version = "1.0.0"
description = "MLB Forecast Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Luis Candelario", email = "lcandelario@lcandesign.com"},
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = false
explicit_package_bases = true
namespace_packages = true
files = ["src/"]
exclude = [
    "^alembic/",
    "^tests/",
    "^scripts/",
    "^models/",
]

# SQLAlchemy plugin for better type checking
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "mlb_api.*",
    "redis.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
    "uvicorn.*",
    "fastapi.*",
    "sqlalchemy.*",
    "alembic.*",
    "pydantic_settings.*",
    "httpx.*",
    "apscheduler.*",
    "structlog.*",
]
ignore_missing_imports = true

# Allow Any returns for database operations temporarily
[[tool.mypy.overrides]]
module = "src.infrastructure.db.repositories.*"
warn_return_any = false
ignore_errors = true

# Allow untyped definitions for interface layer temporarily
[[tool.mypy.overrides]]
module = "src.interface.*"
disallow_untyped_defs = false

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
src_paths = ["src", "tests"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
]
