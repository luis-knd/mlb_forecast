[project]
name = "mlb-forecast-backend"
version = "1.0.0"
description = "MLB Forecast Backend API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Luis Candelario", email = "lcandelario@lcandesign.com"},
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/"]
do_not_mutate = ["src/interface/rest/generated/models/models.py", "src/infrastructure/db/player_stats_models.py", "src/application/ports/player_stats_repository.py", "src/infrastructure/db/repositories/player_stats_repository.py", "src/interface/rest/adapters/player_stats_mappers.py", "src/interface/rest/player_stats_routes.py", "src/interface/rest/routes.py", "src/__init__.py", "src/application/__init__.py", "src/application/dto/mlb_api_response.py", "src/application/ports/__init__.py", "src/application/ports/cache.py", "src/application/ports/catching_stats_repository.py", "src/application/ports/fielding_stats_repository.py", "src/application/ports/game_repository.py", "src/application/ports/hitting_stats_repository.py", "src/application/ports/ml_model.py", "src/application/ports/mlb_api.py", "src/application/ports/pitching_stats_repository.py", "src/application/ports/player_repository.py", "src/application/ports/prediction_repository.py", "src/application/ports/scheduler.py", "src/application/ports/team_repository.py", "src/application/ports/team_stats_repository.py", "src/application/use_cases/__init__.py", "src/application/use_cases/game_use_cases.py", "src/application/use_cases/player_stats_ingestion_use_cases.py", "src/application/use_cases/player_stats_read_use_cases.py", "src/application/use_cases/player_stats_support.py", "src/application/use_cases/player_use_cases.py", "src/application/use_cases/prediction_use_cases.py", "src/application/use_cases/scheduler_use_cases.py", "src/application/use_cases/system_use_cases.py", "src/application/use_cases/team_stats_ingestion_use_cases.py", "src/application/use_cases/team_stats_use_cases.py", "src/application/use_cases/team_use_cases.py", "src/domain/__init__.py", "src/domain/entities/__init__.py", "src/domain/entities/catching_stats.py", "src/domain/entities/fielding_stats.py", "src/domain/entities/game.py", "src/domain/entities/hitting_stats.py", "src/domain/entities/pitching_stats.py", "src/domain/entities/playe